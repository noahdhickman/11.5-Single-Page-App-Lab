<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Find current PC games that are on discount across different online stores">
    <title>Game Deal Finder</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
    <title>Document</title>
</head>

<body>
    <header>
        <h1>Game Deal Finder</h1>
        <p>Search for discounted PC games</p>
    </header>

    <main>
        <form id="search-form">
            <label for="game-search">Game title</label>
            <input id="game-search" type="search" placeholder="Try Elden Ring..." required>
            <button type="submit">Search</button>
        </form>

        <section aria-labelledby="results-heading">
            <h2 id="results-heading">Game deals</h2>
            <p id="message" role="status">Search for a game to see if there are deals.</p>
            <div id="results"></div>
        </section>
    </main>

    <footer>
        <p>Deal information form <a href="https://www.cheapshark.com/">CheapShark</a></p>
    </footer>
</body>
</html>
